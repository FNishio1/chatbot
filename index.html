<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiences Bot · Extremo Oeste</title>
<meta name="robots" content="noindex">

<style>

body {
  margin: 0;
  background: #0F0F10;
  font-family: 'Inter', sans-serif;
}

.bot-toggle {
  position: fixed;
  bottom: 100px;
  right: 25px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #f44061;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  z-index: 9998;
  transition: .3s;
}
.bot-toggle:hover {
  transform: scale(1.1);
  background: #ef2a86;
}

.bot-widget {
  position: fixed;
  bottom: 170px;
  right: 25px;
  width: 360px;
  height: 500px;
  background: #1E1F22;
  border-radius: 16px;
  display: none;
  flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  z-index: 9997;
  border: 1px solid rgba(194,168,120,0.2);
  overflow: hidden;
}

.bot-widget.open {
  display: flex;
}

.bot-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: #B35C3A;
  color: white;
}

.bot-header-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bot-avatar {
  font-size: 1.5rem;
}

.bot-header strong {
  display: block;
  font-size: .95rem;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
}

.bot-header small {
  font-size: .75rem;
  opacity: .85;
}

.bot-close {
  background: none;
  border: none;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
  line-height: 1;
}

.bot-messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bot-msg {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: .88rem;
  line-height: 1.6;
  white-space: pre-wrap;
}

.bot-msg.bot {
  background: #2a2b2f;
  color: #EDE8E1;
  align-self: flex-start;
}

.bot-msg.user {
  background: #B35C3A;
  color: white;
  align-self: flex-end;
}

.bot-msg.typing {
  background: #2a2b2f;
  color: #888;
  font-style: italic;
  align-self: flex-start;
}

/* Botones de respuesta rápida */
.bot-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-self: flex-start;
}

.bot-chips button {
  background: transparent;
  color: #C2A878;
  border: 1px solid #C2A878;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: .85rem;
  cursor: pointer;
  transition: .2s;
}

.bot-chips button:hover,
.bot-chips button:active {
  background: #C2A878;
  color: #0F0F10;
}

.bot-input-area {
  display: flex;
  padding: 12px;
  border-top: 1px solid rgba(255,255,255,.08);
  gap: 8px;
}

.bot-input-area input {
  flex: 1;
  min-width: 0;
  background: #2a2b2f;
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  color: #EDE8E1;
  font-size: 16px; /* 16px evita el zoom automático de iPhone al tocar el input */
  outline: none;
}

.bot-input-area input::placeholder {
  color: #666;
}

.bot-input-area button {
  background: #C2A878;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  color: #0F0F10;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.bot-input-area button:hover {
  background: #d4bc90;
}

.bot-input-area button:disabled,
.bot-input-area input:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.bot-whatsapp-cta {
  position: fixed;
  bottom: 170px;
  right: 400px;
  z-index: 9999;
}

.bot-whatsapp-cta a {
  display: block;
  background: #25D366;
  color: white;
  padding: 12px 20px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 700;
  font-size: .9rem;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* Móvil: el chat ocupa toda la pantalla */
@media (max-width: 480px) {
  .bot-widget {
    inset: 0;
    width: 100%;
    height: 100vh;   /* respaldo para navegadores antiguos */
    height: 100dvh;
    border-radius: 0;
    border: none;
  }
  .bot-whatsapp-cta {
    left: 15px;
    right: 15px;
    bottom: 80px;
    text-align: center;
  }
  /* oculta el botón flotante mientras el chat está abierto */
  body.chat-open .bot-toggle {
    display: none;
  }
}

</style>
</head>

<body>

<!-- Chat Button -->
<button class="bot-toggle" id="bot-toggle" onclick="toggleChat()" aria-label="Open chat">
  💬
</button>

<!-- Chat Widget -->
<div class="bot-widget" id="bot-widget">

  <div class="bot-header">
    <div class="bot-header-info">
      <span class="bot-avatar">🗺</span>
      <div>
        <strong>Experiences Bot</strong>
        <small>Extremo Oeste · Lima</small>
      </div>
    </div>
    <button class="bot-close" onclick="toggleChat()" aria-label="Close chat">×</button>
  </div>

  <div class="bot-messages" id="bot-messages" role="log" aria-live="polite"></div>

  <div class="bot-input-area">
    <input
      id="bot-input"
      type="text"
      maxlength="300"
      placeholder="Ask about our experiences..."
      aria-label="Type your message"
      onkeydown="if(event.key==='Enter') botSend()"
    >
    <button id="bot-send" onclick="botSend()" aria-label="Send message">→</button>
  </div>

</div>

<!-- WhatsApp CTA (shown on hot lead) -->
<div class="bot-whatsapp-cta" id="bot-whatsapp-cta" style="display:none">
  <a id="bot-whatsapp-link"
     href="https://wa.me/51999156493"
     target="_blank" rel="noopener">
    📲 Book now via WhatsApp
  </a>
</div>

<script>

const WORKER_URL = "https://experience-ai.limaexpiriences.workers.dev/";
const WHATSAPP_NUMBER = "51999156493";
const MAX_HISTORY = 10;      // mensajes que se envían al Worker (menos costo y latencia)
const REQUEST_TIMEOUT = 25000; // ms
const AUTO_OPEN = true;      // true = el chat se abre solo al entrar; false = solo con el botón

const QUICK_REPLIES = ["History", "Gastronomy", "Nature", "Something custom"];

let botConversation = [];
let chatOpen = false;
let greeted = false;
let sending = false;

function toggleChat() {
  chatOpen = !chatOpen;
  const widget = document.getElementById('bot-widget');
  widget.classList.toggle('open', chatOpen);
  document.body.classList.toggle('chat-open', chatOpen);

  if (!chatOpen) {
    document.getElementById('bot-whatsapp-cta').style.display = 'none';
  }

  if (chatOpen && !greeted) {
    greeted = true;
    setTimeout(() => {
      addBotMessage("Hi! I'm the Experiences Bot 🗺\n\nI can help you discover Lima through the eyes of a local. Which type of experience interests you — history, gastronomy, nature, or something custom?");
      addQuickReplies();
    }, 400);
  }
}

function addBotMessage(text) {
  const div = document.createElement('div');
  div.className = 'bot-msg bot';
  div.textContent = text;
  document.getElementById('bot-messages').appendChild(div);
  scrollBot();
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'bot-msg user';
  div.textContent = text;
  document.getElementById('bot-messages').appendChild(div);
  scrollBot();
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'bot-msg typing';
  div.id = 'bot-typing';
  div.textContent = 'Writing...';
  document.getElementById('bot-messages').appendChild(div);
  scrollBot();
}

function addQuickReplies() {
  const wrap = document.createElement('div');
  wrap.className = 'bot-chips';
  wrap.id = 'bot-chips';
  QUICK_REPLIES.forEach(label => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.addEventListener('click', () => sendText(label));
    wrap.appendChild(btn);
  });
  document.getElementById('bot-messages').appendChild(wrap);
  scrollBot();
}

function scrollBot() {
  const msgs = document.getElementById('bot-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function setSending(state) {
  sending = state;
  document.getElementById('bot-input').disabled = state;
  document.getElementById('bot-send').disabled = state;
}

// Historial recortado que se envía al Worker (siempre empieza con un mensaje del usuario)
function recentHistory() {
  const slice = botConversation.slice(-MAX_HISTORY);
  while (slice.length && slice[0].role !== 'user') slice.shift();
  return slice;
}

// Enlace de WhatsApp con un resumen de lo que pidió el cliente
function updateWhatsAppLink() {
  const asked = botConversation
    .filter(m => m.role === 'user')
    .slice(-3)
    .map(m => m.content.slice(0, 120));

  let msg = "Hi, I would like to book an experience with Extremo Oeste.";
  if (asked.length) {
    msg += "\n\nWhat I told your bot:\n- " + asked.join("\n- ");
  }
  document.getElementById('bot-whatsapp-link').href =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function botSend() {
  const input = document.getElementById('bot-input');
  sendText(input.value);
}

async function sendText(rawText) {
  if (sending) return;
  const text = rawText.trim();
  if (!text) return;

  document.getElementById('bot-chips')?.remove();
  document.getElementById('bot-input').value = "";
  setSending(true);

  addUserMessage(text);
  botConversation.push({ role: "user", content: text });
  addTyping();

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: recentHistory() }),
      signal: controller.signal
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("Invalid reply");
    }

    document.getElementById('bot-typing')?.remove();

    let reply = data.reply;
    const isHotLead = data.isHotLead;

    // Remove WhatsApp CTA tag from visible message
    const showWhatsApp = reply.includes('[WHATSAPP_CTA]');
    reply = reply.replace('[WHATSAPP_CTA]', '').trim();

    botConversation.push({ role: "assistant", content: reply });
    addBotMessage(reply);

    // Show WhatsApp CTA button if hot lead or bot triggered it
    if (showWhatsApp || isHotLead) {
      updateWhatsAppLink();
      document.getElementById('bot-whatsapp-cta').style.display = 'block';
    }

  } catch (error) {
    document.getElementById('bot-typing')?.remove();
    // Quita el mensaje sin respuesta para que el historial siga alternando usuario/bot
    botConversation.pop();
    addBotMessage("Sorry, I'm having trouble connecting. Please try again, or contact us directly via WhatsApp.");
  } finally {
    clearTimeout(timer);
    setSending(false);
    document.getElementById('bot-input').focus();
  }
}

if (AUTO_OPEN) toggleChat();

</script>

</body>
</html>
